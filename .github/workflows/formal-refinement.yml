name: Formal refinement

on:
  pull_request:
    paths:
      - 'formal/**'
      - 'src/**'
      - 'tests/**'
      - 'conformance/**'
      - 'scripts/**'
      - 'projects/**'
      - 'schemas/**'
      - 'infra-isolation/**'
      - '.github/workflows/formal-refinement.yml'
  push:
    branches: [main]
    paths:
      - 'formal/**'
      - 'src/**'
      - 'tests/**'
      - 'conformance/**'
      - 'scripts/**'
      - 'projects/**'
      - 'schemas/**'
      - 'infra-isolation/**'
      - '.github/workflows/formal-refinement.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-refinement-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact consumer head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Validate refinement manifest and pinned witness
        id: refinement
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(jq -r '.schema' formal/refinement.json)" = 'sonus-auris.formal-refinement/v1'
          test "$(jq -r '.repository' formal/refinement.json)" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.formalRepository' formal/refinement.json)" = 'sonus-auris/sonus-auris-formal'
          test "$(jq -r '.formalCommit' formal/refinement.json)" = '84db1c2dee8c0e40ed6511189728f47626542a9e'
          jq -e '.admission.exactHeadRequired and .admission.exactFormalCommitRequired and .admission.zeroStepRunIsNotEvidence and .admission.vendoredSpecMustMatchPinnedBlob' formal/refinement.json >/dev/null

          vendor="$(jq -r '.vendoredSpec' formal/refinement.json)"
          expected_blob="$(jq -r '.formalBlobSha' formal/refinement.json)"
          test -f "$vendor"
          actual_blob="$(git hash-object "$vendor")"
          test "$actual_blob" = "$expected_blob" || {
            echo "::error::vendored formal model blob $actual_blob does not match pinned central blob $expected_blob"
            exit 1
          }

          while IFS= read -r path; do
            test -e "$path" || { echo "::error::missing refinement path $path"; exit 1; }
          done < <(jq -r '.implementationPaths[]' formal/refinement.json)

          {
            echo "vendor=$vendor"
            echo "module=$(jq -r '.module' formal/refinement.json)"
            echo "invariant=$(jq -r '.invariant' formal/refinement.json)"
            echo "witnesses=$(jq -r '.witnesses | join(" ")' formal/refinement.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.16.0'

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'

      - name: Typecheck pinned model witness
        run: npx --yes --package='@informalsystems/quint@0.32.0' quint typecheck "${{ steps.refinement.outputs.vendor }}"

      - name: Simulate invariant and witnesses
        shell: bash
        run: |
          set -euo pipefail
          read -r -a witnesses <<< "${{ steps.refinement.outputs.witnesses }}"
          npx --yes --package='@informalsystems/quint@0.32.0' quint run "${{ steps.refinement.outputs.vendor }}"             --main="${{ steps.refinement.outputs.module }}"             --max-samples=2000             --max-steps=16             --invariant="${{ steps.refinement.outputs.invariant }}"             --witnesses "${witnesses[@]}"

      - name: Exhaustively verify invariant
        run: |
          npx --yes --package='@informalsystems/quint@0.32.0' quint verify "${{ steps.refinement.outputs.vendor }}"             --main="${{ steps.refinement.outputs.module }}"             --max-steps=16             --invariant="${{ steps.refinement.outputs.invariant }}"
