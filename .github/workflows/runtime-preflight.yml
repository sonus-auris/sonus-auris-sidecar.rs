name: Sidecar runtime preflight

on:
  pull_request:
    paths:
      - ".cli-flags.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/**"
      - ".github/workflows/runtime-preflight.yml"
  push:
    branches: [main]
    paths:
      - ".cli-flags.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/**"
      - ".github/workflows/runtime-preflight.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy

      - name: Verify committed dependency graph
        run: |
          cargo +1.90.0 metadata --locked --format-version 1 > /dev/null
          git diff --exit-code -- Cargo.lock
          grep -F 'rev = "38c30455f492b028a990b562287a067db591126f"' Cargo.toml
          grep -F 'flags-2-env/flags-2-env.git?rev=fbd927d0a9c91617a04ae8f4ee7647253846dbd6' Cargo.lock

      - name: Format
        run: cargo +1.90.0 fmt --all -- --check

      - name: Clippy
        run: cargo +1.90.0 clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo +1.90.0 test --all-targets --locked

      - name: Exercise the real flags-2-env preflight boundary
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.90.0 run --quiet --locked --bin sonus-auris-sidecar -- preflight

          if SONUS_AURIS_SIDECAR_BIND=not-a-socket \
            cargo +1.90.0 run --quiet --locked --bin sonus-auris-sidecar -- preflight; then
            echo "invalid environment bind unexpectedly passed" >&2
            exit 1
          fi

          SONUS_AURIS_SIDECAR_BIND=not-a-socket \
            cargo +1.90.0 run --quiet --locked --bin sonus-auris-sidecar -- \
              preflight --bind=127.0.0.1:19090

          set +e
          rejected="$(
            cargo +1.90.0 run --quiet --locked --bin sonus-auris-sidecar -- \
              preflight --definitely-not-declared=synthetic-secret-never-reflect 2>&1
          )"
          status=$?
          set -e
          test "$status" -ne 0
          if grep -F "synthetic-secret-never-reflect" <<<"$rejected"; then
            echo "rejected argv value leaked into diagnostics" >&2
            exit 1
          fi

      - name: Retain lockfile evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sonus-sidecar-lock-${{ github.event.pull_request.head.sha || github.sha }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7
