name: Container entrypoint, probe, and multi-arch

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-entrypoint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  entrypoint-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify POSIX wrapper and exit propagation
        shell: bash
        run: |
          set -euo pipefail
          sh -n docker/entrypoint.sh
          test "$(sh docker/entrypoint.sh sh -c 'printf ok')" = "ok"
          set +e
          sh docker/entrypoint.sh sh -c 'exit 23'
          status=$?
          set -e
          test "$status" -eq 23
      - name: Validate immutable pins and smoke scripts
        run: |
          set -euo pipefail
          grep -Eq '^[0-9a-f]{40}$' docker/ores-launcher.rev
          test "$(wc -l < docker/ores-launcher.rev)" -eq 1
          grep -F 'rev = "e20f4f5802b3257a4521fc4192456cdca18a9630"' Cargo.toml
          bash -n docker/test-rust-launcher.sh
          bash -n docker/test-launcher-adversarial.sh

  docker-build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build hardened default with docker build
        run: docker build --progress=plain --tag sonus-auris-sidecar:runtime-ci .
      - name: Build wrapper target with docker build
        run: docker build --progress=plain --target shell-runtime --tag sonus-auris-sidecar:shell-ci .
      - name: Verify image execution metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect sonus-auris-sidecar:runtime-ci --format '{{json .Config.Entrypoint}}')" = '["/ores-launcher","/sonus-auris-sidecar"]'
          test "$(docker image inspect sonus-auris-sidecar:runtime-ci --format '{{json .Config.WorkingDir}}')" = '"/"'
          test "$(docker image inspect sonus-auris-sidecar:shell-ci --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/entrypoint.sh"]'
          test "$(docker image inspect sonus-auris-sidecar:shell-ci --format '{{json .Config.Cmd}}')" = '["/sonus-auris-sidecar"]'
      - name: Verify real distroless startup and ores-otel command logging
        run: bash docker/test-rust-launcher.sh sonus-auris-sidecar:runtime-ci
      - name: Verify adversarial launcher behavior in the actual consumer image
        run: bash docker/test-launcher-adversarial.sh sonus-auris-sidecar:runtime-ci
      - name: Verify kubelet-style exec probes without a shell
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name sonus-auris-sidecar-probe \
            --read-only \
            --security-opt=no-new-privileges \
            sonus-auris-sidecar:runtime-ci
          trap 'docker rm --force sonus-auris-sidecar-probe >/dev/null 2>&1 || true' EXIT

          ready=0
          for _ in $(seq 1 50); do
            if docker exec sonus-auris-sidecar-probe \
              /sonus-auris-sidecar probe; then
              ready=1
              break
            fi
            sleep 0.1
          done
          test "$ready" -eq 1

          docker exec sonus-auris-sidecar-probe \
            /sonus-auris-sidecar probe-healthz
          docker exec sonus-auris-sidecar-probe \
            /sonus-auris-sidecar probe-readyz

          if docker exec sonus-auris-sidecar-probe \
            /sonus-auris-sidecar --definitely-not-declared; then
            echo "unknown arguments must fail closed" >&2
            exit 1
          fi

  buildx-multiarch:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build hardened default for amd64 and arm64
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target runtime \
            --progress=plain \
            --output type=oci,dest=/tmp/sonus-auris-sidecar-runtime.oci.tar \
            .
          test -s /tmp/sonus-auris-sidecar-runtime.oci.tar
      - name: Build wrapper target for amd64 and arm64
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target shell-runtime \
            --progress=plain \
            --output type=oci,dest=/tmp/sonus-auris-sidecar-shell.oci.tar \
            .
          test -s /tmp/sonus-auris-sidecar-shell.oci.tar
