name: Container entrypoint, probe, and multi-arch

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-entrypoint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  entrypoint-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify POSIX wrapper and exit propagation
        shell: bash
        run: |
          set -euo pipefail
          sh -n docker/entrypoint.sh
          test "$(sh docker/entrypoint.sh sh -c 'printf ok')" = "ok"
          set +e
          sh docker/entrypoint.sh sh -c 'exit 23'
          status=$?
          set -e
          test "$status" -eq 23
      - name: Validate immutable pins and smoke scripts
        run: |
          set -euo pipefail
          grep -Eq '^[0-9a-f]{40}$' docker/ores-launcher.rev
          test "$(wc -l < docker/ores-launcher.rev)" -eq 1
          grep -F 'rev = "38c30455f492b028a990b562287a067db591126f"' Cargo.toml
          grep -F 'rev=fbd927d0a9c91617a04ae8f4ee7647253846dbd6' Cargo.lock
          bash -n docker/test-rust-launcher.sh
          bash -n docker/test-launcher-adversarial.sh
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Verify committed dependency graph
        run: |
          cargo +1.90.0 metadata --locked --format-version 1 > /dev/null
          git diff --exit-code -- Cargo.lock
      - name: Format
        run: cargo +1.90.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.90.0 clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo +1.90.0 test --all-targets --locked
      - name: Exercise real flags-2-env startup boundary
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.90.0 run --quiet --locked --bin sonus-auris-sidecar -- preflight

          if SONUS_AURIS_SIDECAR_BIND=not-a-socket \
            cargo +1.90.0 run --quiet --locked --bin sonus-auris-sidecar -- preflight; then
            echo "invalid environment bind unexpectedly passed" >&2
            exit 1
          fi

          SONUS_AURIS_SIDECAR_BIND=not-a-socket \
            cargo +1.90.0 run --quiet --locked --bin sonus-auris-sidecar -- \
              preflight --bind=127.0.0.1:19090

          set +e
          rejected="$(
            cargo +1.90.0 run --quiet --locked --bin sonus-auris-sidecar -- \
              --definitely-not-declared=synthetic-secret-never-reflect 2>&1
          )"
          status=$?
          set -e
          test "$status" -ne 0
          if grep -F "synthetic-secret-never-reflect" <<<"$rejected"; then
            echo "rejected argv value leaked into diagnostics" >&2
            exit 1
          fi

  docker-build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build hardened default with docker build
        run: docker build --progress=plain --tag sonus-auris-sidecar:runtime-ci .
      - name: Build wrapper target with docker build
        run: docker build --progress=plain --target shell-runtime --tag sonus-auris-sidecar:shell-ci .
      - name: Verify image execution metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect sonus-auris-sidecar:runtime-ci --format '{{json .Config.Entrypoint}}')" = '["/ores-launcher","/sonus-auris-sidecar"]'
          test "$(docker image inspect sonus-auris-sidecar:runtime-ci --format '{{json .Config.WorkingDir}}')" = '"/"'
          test "$(docker image inspect sonus-auris-sidecar:shell-ci --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/entrypoint.sh"]'
          test "$(docker image inspect sonus-auris-sidecar:shell-ci --format '{{json .Config.Cmd}}')" = '["/sonus-auris-sidecar"]'
      - name: Verify image preflight without opening a listener
        run: |
          docker run --rm sonus-auris-sidecar:runtime-ci preflight
          docker run --rm sonus-auris-sidecar:shell-ci /sonus-auris-sidecar preflight
      - name: Verify real distroless startup and ores-otel command logging
        run: bash docker/test-rust-launcher.sh sonus-auris-sidecar:runtime-ci
      - name: Verify adversarial launcher behavior in the actual consumer image
        run: bash docker/test-launcher-adversarial.sh sonus-auris-sidecar:runtime-ci
      - name: Verify kubelet-style exec probes without a shell
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name sonus-auris-sidecar-probe \
            --read-only \
            --security-opt=no-new-privileges \
            sonus-auris-sidecar:runtime-ci
          trap 'docker rm --force sonus-auris-sidecar-probe >/dev/null 2>&1 || true' EXIT

          ready=0
          for _ in $(seq 1 50); do
            if docker exec sonus-auris-sidecar-probe \
              /sonus-auris-sidecar probe; then
              ready=1
              break
            fi
            sleep 0.1
          done
          test "$ready" -eq 1

          docker exec sonus-auris-sidecar-probe \
            /sonus-auris-sidecar probe-healthz
          docker exec sonus-auris-sidecar-probe \
            /sonus-auris-sidecar probe-readyz

          if docker exec sonus-auris-sidecar-probe \
            /sonus-auris-sidecar --definitely-not-declared; then
            echo "unknown arguments must fail closed" >&2
            exit 1
          fi

  buildx-multiarch:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build hardened default for amd64 and arm64
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target runtime \
            --progress=plain \
            --output type=oci,dest=/tmp/sonus-auris-sidecar-runtime.oci.tar \
            .
          test -s /tmp/sonus-auris-sidecar-runtime.oci.tar
      - name: Build wrapper target for amd64 and arm64
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target shell-runtime \
            --progress=plain \
            --output type=oci,dest=/tmp/sonus-auris-sidecar-shell.oci.tar \
            .
          test -s /tmp/sonus-auris-sidecar-shell.oci.tar
