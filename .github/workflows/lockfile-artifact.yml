name: lockfile-artifact

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/lockfile-artifact.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate the exact Cargo lockfile
        run: |
          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            rust:1.90-bookworm \
            cargo generate-lockfile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sonus-cargo-lock-den-4253
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
