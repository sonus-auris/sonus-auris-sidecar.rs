# flags-2-env surface for `sonus-auris-sidecar`
[identity]
service = "sonus-auris-sidecar"
type_name = "SidecarEnv"

[help]
url = "https://github.com/sonus-auris/sonus-auris-sidecar.rs"
columns = ["options", "env", "type", "default", "description"]

[env]
files = []

[parse]
allow_unknown = false
command_env = "SONUS_AURIS_SIDECAR_COMMAND"

[flags.bind]
env = "SONUS_AURIS_SIDECAR_BIND"
long = "bind"
type = "string"
default = "127.0.0.1:9090"
help = "HTTP listen address for /healthz /readyz /metrics."

[commands.preflight]
env = "SONUS_AURIS_SIDECAR_COMMAND_PREFLIGHT"
help = "Validate the flags-2-env startup contract without opening a listener."

[commands.probe]
aliases = ["probe-healthz"]
env = "SONUS_AURIS_SIDECAR_COMMAND_PROBE"
help = "Run one bounded loopback GET against /healthz and exit."

[commands.probe-readyz]
env = "SONUS_AURIS_SIDECAR_COMMAND_PROBE_READYZ"
help = "Run one bounded loopback GET against /readyz and exit."
