[package]
org = "sonus-auris"
name = "sonus-auris-sidecar"
version = "0.1.0"
description = "k8s sidecar for Sonus Auris."
license = "MIT"
keywords = ["sidecar", "observability", "k8s"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/sonus-auris/sonus-auris-sidecar.rs"

[dependencies]
"ores-otel/ores-otel-sidecar" = "^0.1.0"

[build]
command = "cargo build --release --locked --bin sonus-auris-sidecar"
outputs = ["target/release/sonus-auris-sidecar"]

[bin]
sonus-auris-sidecar = "target/release/sonus-auris-sidecar"

[install]
adapter = "none"

[scripts]
test = "cargo test --all-targets --locked"
